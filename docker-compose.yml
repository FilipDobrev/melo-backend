services:
  postgres:
    image: postgres:16-alpine
    container_name: melo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: melo
    ports:
      - '5432:5432'
    volumes:
      - melo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d melo']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for local development. Console at http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: melo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: melo
      MINIO_ROOT_PASSWORD: melo-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - melo-miniodata:/data

volumes:
  melo-pgdata:
  melo-miniodata:
