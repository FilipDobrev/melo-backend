delete:
  operationId: deletePostImage
  summary: Remove an image from a post
  description: >-
    Owner only. Any image can be removed, including the last one: a post
    may have zero images, and clients then show the recipe's image.
  tags: [Posts]
  security:
    - bearerAuth: []
  parameters:
    - $ref: '../../components/parameters/postId.yaml'
    - $ref: '../../components/parameters/imageId.yaml'
  responses:
    '204':
      description: Image removed.
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '429':
      $ref: '../../components/responses/TooManyRequests.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
