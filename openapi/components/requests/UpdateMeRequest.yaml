type: object
description: Any subset of the fields. Omit a key to leave it unchanged.
properties:
  username:
    type: string
    minLength: 3
    maxLength: 30
    description: Must be unique.
  profileImage:
    type:
      - string
      - 'null'
    minLength: 1
    maxLength: 500
    description: >-
      A storage key under the caller's own `avatars/{userId}/` prefix,
      obtained from POST /users/me/avatar/upload-url. `null` clears the
      avatar. Omitting the key leaves it unchanged. Responses may still
      return a legacy absolute URL for accounts whose profileImage was
      written before this restriction, but a write can no longer produce
      that form.
