type: object
description: A post always documents cooking a recipe, so recipeId is required.
required:
  - recipeId
  - imageKeys
properties:
  caption:
    type: string
    maxLength: 2000
  recipeId:
    type: string
    format: uuid
    description: Must reference an existing recipe.
  imageKeys:
    type: array
    minItems: 1
    maxItems: 10
    items:
      type: string
    description: >-
      Storage keys returned by POST /posts/images/upload-url, each under the
      caller's own prefix. Order defines display position. Every key is
      verified against storage before the post is created.
