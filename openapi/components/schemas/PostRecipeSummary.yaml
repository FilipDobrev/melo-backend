type: object
description: >-
  The recipe a post documents, as embedded in Post. Narrower than
  RecipeSummary — only what a post card needs, plus the viewer-specific
  isSaved flag. Required on every post: a post always links to a recipe.
required:
  - id
  - title
  - nutrition
  - isSaved
  - servings
  - imageUrl
properties:
  id:
    type: string
    format: uuid
  title:
    type: string
  nutrition:
    $ref: './Nutrition.yaml'
  isSaved:
    type: boolean
    description: >-
      Whether the current viewer has saved this recipe to their own
      cookbook. False for an anonymous viewer.
  imageUrl:
    type: string
    format: uri
    description: >-
      The recipe's own image (upload or preset), always a resolved URL.
      Clients show it when the post has no images of its own.
  servings:
    type: integer
    minimum: 1
    maximum: 100
    description: >-
      Portions the recipe makes. `nutrition` above is the whole-recipe
      total; divide by this to get per-serving values.
